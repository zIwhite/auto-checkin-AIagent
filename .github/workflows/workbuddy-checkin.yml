name: workbuddy checkin

on:
  workflow_dispatch:
  schedule:
    # UTC 01:30 / 12:30 = 北京时间 09:30 / 20:30
    - cron: '30 1,12 * * *'

# keepalive 需要 actions:write; checkout 需要 contents:read
permissions:
  contents: read
  actions: write

concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: run workbuddy checkin
        env:
          ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          if [ -z "$ACCOUNTS" ]; then
            echo "::error::未配置 WORKBUDDY_ACCOUNTS secret（格式: ACCESS_TOKEN#UID#备注）"
            exit 1
          fi
          jq -n \
            --arg accounts "$ACCOUNTS" \
            --arg app_token "$WXPUSHER_APP_TOKEN" \
            --arg wx_uid "$WXPUSHER_UID" \
            '{accounts: $accounts}
             + (if $app_token != "" then {wxpusher_app_token: $app_token} else {} end)
             + (if $wx_uid != "" then {wxpusher_uid: $wx_uid} else {} end)' \
          | python3 -X utf8 channels/workbuddy/channel.py | tee /tmp/checkin.log

          result="$(grep '^__CHECKIN_RESULT__' /tmp/checkin.log | tail -n 1 | sed 's/^__CHECKIN_RESULT__//')"
          if [ -z "$result" ]; then
            echo "::error::脚本未输出结构化结果"
            exit 1
          fi
          echo "$result" | jq .
          if ! echo "$result" | jq -e '.success == true' >/dev/null; then
            echo "::error::签到失败: $(echo "$result" | jq -r '.message')"
            exit 1
          fi

      - name: keep alive
        if: github.event_name == 'schedule'
        uses: liskin/gh-workflow-keepalive@v1

      - name: delete old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 7
          delete_run_by_conclusion_pattern: ALL
